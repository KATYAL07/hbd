<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Ennaflix - Who's watching?</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Custom Font -->
  <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;500;700&amp;display=swap"
    rel="stylesheet">
  <style data-purpose="custom-styling">
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #141414;
      /* Netflix standard dark background */
      color: white;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo {
      color: #E50914;
      /* Netflix red */
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      /* Arc effect simulation (basic CSS) */
      display: inline-block;
      transform: scaleY(1.2);
    }

    .profile-avatar {
      width: 152px;
      height: 152px;
      border-radius: 4px;
      object-fit: cover;
      transition: outline 0.1s ease-in-out;
      outline: 0 solid white;
    }

    .profile-item:hover .profile-avatar {
      outline-width: 4px;
    }

    .profile-name {
      color: #808080;
      font-size: 1.25rem;
      margin-top: 0.8rem;
      transition: color 0.1s ease-in-out;
    }

    .profile-item:hover .profile-name {
      color: white;
    }

    .kids-avatar {
      background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      border-radius: 4px;
    }

    .manage-btn {
      border: 1px solid grey;
      color: grey;
      padding: 0.5rem 1.5rem;
      font-size: 1.25rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.2s ease-in-out;
      margin-top: 4rem;
    }

    .manage-btn:hover {
      color: white;
      border-color: white;
    }
  </style>
</head>

        </div>
        <span

      <!-- Profile 4: Kids -->

        <div

    <!-- Manage Profiles Button -->

    </div>
  </main>

</body>
