        <style>
                @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;800&display=swap');

                body {
                        font-family: 'Geist', sans-serif;
                        background-color: #000000;
                        /* Solid black override for true cinematic feel */
                        margin: 0;
                        overflow: hidden;
                }

                .glow-text {
                        text-shadow: 0 0 20px rgba(229, 9, 20, 0.7), 0 0 40px rgba(229, 9, 20, 0.4);
                }

                .loading-bar-container {
                        width: 200px;
                        height: 2px;
                        background-color: #333333;
                        border-radius: 2px;
                        overflow: hidden;
                        margin-top: 16px;
                }

                .loading-bar-fill {
                        height: 100%;
                        background-color: #e50914;
                        /* primary-container */
                        width: 0%;
                        animation: fillBar 3s ease-in-out forwards;
                }

                @keyframes fillBar {
                        0% {
                                width: 0%;
                        }

                        100% {
                                width: 100%;
                        }
                }
        </style>

<body class="bg-black text-on-background min-h-screen flex items-center justify-center">
        <!-- Main Content Canvas - Fully Centered Loading State -->
        <main class="flex flex-col items-center justify-center">

                <h1

                <!-- Loading Bar -->

                        <div class="loading-bar-fill"></div>

        </main>
