<!-- STITCH_SVG_START:ANIMATION_30 class="w-full h-full object-contain" --><div class="w-full h-full object-contain" id="animated-svg-ANIMATION_30" style="display:block;"><svg class="w-full h-full" viewbox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
      @keyframes letter-zoom {
        0% {
          transform: scale(0.5);
          opacity: 0;
          filter: blur(20px);
        }
        50% {
          opacity: 1;
          filter: blur(0px);
        }
        100% {
          transform: scale(1.2);
          opacity: 0;
          filter: blur(10px);
        }
      }
      
      @keyframes stroke-glow {
        0%, 100% { filter: drop-shadow(0 0 0px #e50914); }
        50% { filter: drop-shadow(0 0 30px #e50914); }
      }

      .netflix-e {
        fill: #e50914;
        transform-origin: center;
        animation: letter-zoom 3s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                   stroke-glow 2s ease-in-out infinite;
      }
      
      .bg-rect {
        fill: #121414;
      }
    </style>
</defs>
<rect class="bg-rect" height="400" width="400"></rect>
<!-- A stylized, bold 'E' that mimics the Netflix brand curve and weight -->
<path class="netflix-e" d="M120 100 H280 V140 H170 V180 H260 V220 H170 V260 H280 V300 H120 Z"></path>
</svg></div><!-- STITCH_SVG_END:ANIMATION_30 -->
